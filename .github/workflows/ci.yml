name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test (with real PostgreSQL)
    runs-on: ubuntu-latest

    # A real PostgreSQL 17 so the integration suite can exercise Row-Level
    # Security and the immutability triggers (audit findings F-01 / F-02). The
    # default superuser is used only to provision a NON-superuser runtime role —
    # RLS is bypassed by superusers, so the tests must run as qams_app.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Non-superuser role + dedicated CI database (created in the step below).
      CI_PG_CONN: "Host=localhost;Port=5432;Database=ntqms_ci;Username=qams_app;Password=ci-only-pass"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore NT.QAMS.sln

      - name: Build
        run: dotnet build NT.QAMS.sln --configuration Release --no-restore

      # SEC-002: Software Composition Analysis. Fail the build on any known-
      # vulnerable NuGet package (direct or transitive) — the DB as last line
      # of defense has a supply-chain analogue here.
      - name: Dependency vulnerability scan (.NET SCA)
        run: |
          dotnet list NT.QAMS.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE '\b(Critical|High)\b' vuln.txt; then
            echo "::error::High/Critical vulnerable NuGet package(s) found — see log."
            exit 1
          fi

      - name: Provision non-superuser role + CI database
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE qams_app LOGIN PASSWORD 'ci-only-pass' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;" \
            -c "CREATE DATABASE ntqms_ci OWNER qams_app;"

      - name: Apply EF migrations (as the owning role)
        env:
          ConnectionStrings__Postgres: ${{ env.CI_PG_CONN }}
        run: |
          dotnet tool restore
          dotnet ef database update \
            --project src/NT.QAMS.Infrastructure \
            --startup-project src/NT.QAMS.WebApi \
            --configuration Release --no-build

      # Runs the whole solution. The integration project talks to the real
      # database via QMS_ITEST_POSTGRES; every other project is provider-agnostic.
      # Architecture tests are a merge gate: a layer/module boundary violation
      # fails the pipeline, not code review.
      # TENANT-004 gate: because QMS_ITEST_POSTGRES is set, the RLS suite
      # HARD-FAILS (instead of skipping) if the database is unreachable or the
      # connection role is not least-privilege (SUPERUSER/BYPASSRLS) — see
      # RuntimeRolePrivilegeTests + RealPostgresFixture.
      - name: Test
        env:
          QMS_ITEST_POSTGRES: ${{ env.CI_PG_CONN }}
        run: dotnet test NT.QAMS.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend (unit + build + e2e smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # SEC-002: SCA for the SHIPPED frontend (prod deps). Fails on any
      # high/critical advisory EXCEPT those explicitly allow-listed (with a
      # documented reason + compensating control) in
      # .github/npm-audit-allowlist.txt — reviewed every dependency bump.
      - name: Dependency vulnerability scan (npm SCA)
        run: |
          npm audit --omit=dev --json > audit.json || true
          allow=$(grep -vE '^\s*#|^\s*$' ../.github/npm-audit-allowlist.txt | sort -u)
          found=$(jq -r '[.vulnerabilities[]?.via[]? | select(type=="object") | select(.severity=="high" or .severity=="critical") | .url] | unique | .[]' audit.json | sort -u)
          unexpected=$(comm -23 <(echo "$found") <(echo "$allow") | grep -v '^$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Un-allowlisted high/critical npm advisories:"; echo "$unexpected"; exit 1
          fi
          echo "npm SCA: no high/critical advisories outside the reviewed allowlist."

      # Karma/Jasmine component + service unit tests (F-18), headless Chrome.
      - name: Unit tests
        run: npm run test:ci

      - name: Production build (AOT)
        run: npm run build

      # Playwright e2e (F-18). The backend-free auth/route-guard smoke and the
      # axe-core accessibility scan (Road-to-100 Phase 9) run on every push;
      # the tenant-scoped workflow spec runs where a seeded API is available
      # (see e2e/README.md).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (auth gate + a11y scan)
        run: npx playwright test e2e/auth.spec.ts e2e/a11y.spec.ts

  # DEPLOY-002 verification (closure report R-1): the hardened image must
  # actually build, and its runtime user must be unprivileged. The dev
  # machines have no Docker, so CI is where this is proven.
  container:
    name: Container (build + non-root assertion)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f src/NT.QAMS.WebApi/Dockerfile -t ntqams-webapi:ci .

      - name: Assert the runtime user is not root
        run: |
          uid=$(docker run --rm --entrypoint id ntqams-webapi:ci -u)
          echo "runtime uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::container runs as root — DEPLOY-002 violated"
            exit 1
          fi

      - name: Assert the evidence volume is writable by the runtime user
        run: docker run --rm --entrypoint sh ntqams-webapi:ci -c 'touch /app/data/files/.ci-probe && rm /app/data/files/.ci-probe'

      # SEC-002: scan the built image for OS/library CVEs. Uses the Trivy CLI
      # directly (no action-tag to drift). Fails on HIGH/CRITICAL that have an
      # available fix (--ignore-unfixed avoids flapping on base-image CVEs with
      # no upstream patch yet — re-evaluated as the base image updates).
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin
          trivy --version
      - name: Trivy image vulnerability scan
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress ntqams-webapi:ci
