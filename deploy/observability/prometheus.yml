global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # The API's own Prometheus endpoint (OBS-003): RED + Npgsql pool + NT.QAMS
  # outbox/job instruments.
  - job_name: nt-qams-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # Metrics the API pushed over OTLP, re-exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
