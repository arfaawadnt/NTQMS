# OpenTelemetry Collector — receives OTLP from the NT.QMS API and re-exposes
# metrics for Prometheus to scrape. Traces/logs would forward to a backend
# (Tempo/Loki/vendor) via additional exporters when one is provisioned.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 20

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]   # replace with otlp/tempo when a trace backend exists
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
